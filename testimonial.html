<!DOCTYPE html>
<html>
    <head>
        <title>A sample web page</title>
    </head>
    <style>
        body {
            background-color: lightblue;
        }
        h1 {
            color: rgb(55, 55, 251);
            font-family: 'Courier New', Courier, monospace;
            margin-top: 20px;
            font-size: 40px;
        }
        h4 {
            color: green;
            font-family: Arial, Helvetica, sans-serif;
        }
        p {
            line-height: 1.6;
        }
        .card {
            background-color: white;
            width: 450px;
            border: solid 5px white;
            border-radius: 20px;
            margin: 15px auto;
            text-align: center;
        }
        button {
            font-weight: bold;
            padding: 20px;
            background-color: rgb(55, 55, 251);
            border-radius: 10px;
            color: white;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .profile {
            margin-top: 20px;
            margin-left: 570px;
            width: 350px;
            height: 350px;
            border-radius: 175px;
        }
        .left {
            position: absolute;
            left: 0px;
            top: 0px;
            width: 20%;
            height: 100%;
        }
        .right {
            position: absolute;
            right: 0px;
            top: 0px;
            width: 20%;
            height: 100%;
        }
    </style>
    <body>
        <img src="web-bootcamp-pictures/profile photo.jpe" class="profile">
        <img src="web-bootcamp-pictures/darkGreen.jpg" class="left">
        <img src="web-bootcamp-pictures/darkGreen.jpg" class="right">
        <div class="card">
            <h1>Sanskriti Rijal</h1>
            <h4>A student interested in Web Development</h4>
            <p>I'm learning html, CSS and javascript. I want to create and design websites in the future.</p>
            <button>Contact Me</button>
        </div>
    </body>
</html>
