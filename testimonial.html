<!DOCTYPE html>
<html>
    <head>
        <title>A sample web page</title>
    </head>
    <style>
        body {
            background-color: lightblue;
        }
        h1 {
            color: rgb(55, 55, 251);
            font-family: 'Courier New', Courier, monospace;
            margin-top: 20px;
            font-size: 40px;
        }
        h4 {
            color: green;
            font-family: Arial, Helvetica, sans-serif;
        }
        p {
            line-height: 1.6;
        }
        .card {
            background-color: white;
            width: 450px;
            border: solid 1px darkblue;
            border-radius: 20px;
            margin: 30px auto;
            text-align: center;
        }
        button {
            font-weight: bold;
            padding: 20px;
            background-color: rgb(55, 55, 251);
            border-radius: 10px;
            color: white;
            margin-bottom: 10px;
            cursor: pointer;
        }
    </style>
    <body>
        <div class="card">
            <h1>Sanskriti Rijal</h1>
            <h4>A student interested in Web Development</h4>
            <p>I'm learning html, CSS and javascript. I want to create and design websites in the future.</p>
            <button>Contact Me</button>
        </div>
    </body>
</html>
